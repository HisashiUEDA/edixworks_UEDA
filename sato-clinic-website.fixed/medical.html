<main class="detail-page detail-medical" id="top"><div class="detail-head"><h1 class="section-title section-title-left">診療内容</h1><a class="text-button detail-back" href="index.html#medical">診療内容に戻る</a></div><article class="detail-medical-row"><img src="images/health-check.jpg" alt="健康診断・各種検査の診療風景"><div><h2>健康診断・各種検査</h2><p>定期健康診断をはじめ、血液検査、尿検査、心電図、超音波検査、レントゲン検査などを行い、病気の早期発見と予防に努めます。異常が見つかった場合は、経過観察や専門治療へとつなげてまいります。</p></div></article><article class="detail-medical-row"><img src="images/vaccination.jpg" alt="予防接種の診療風景"><div><h2>予防接種</h2><p>インフルエンザや肺炎球菌などの各種予防接種を行っています。定期的な接種で感染予防と体調管理を支援いたします。予防接種は予約制となりますので、事前にお問い合わせください。</p></div></article><article class="detail-medical-row"><img src="images/smoking.jpg" alt="禁煙外来の診療風景"><div><h2>禁煙外来</h2><p>禁煙をご希望の方に、禁煙治療とサポートを行っています。必要に応じて、ニコチン依存症の治療薬を使用し、無理なく禁煙が継続できるようお手伝いいたします。</p></div></article></main>
